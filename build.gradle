plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '2.3.12.RELEASE'
    jjwtVersion = '0.9.1'
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-security:${springBootVersion}"
    implementation "org.flywaydb:flyway-core:6.5.7"
    implementation 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"
    implementation 'org.springdoc:springdoc-openapi-ui:1.4.4'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.6.6'
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server:${springBootVersion}"
    runtimeOnly 'com.h2database:h2:1.4.200'
    implementation "io.jsonwebtoken:jjwt:${jjwtVersion}"

    // JAXB was removed from the JDK in Java 11+; Hibernate 5.4 still needs it at runtime.
    runtimeOnly 'javax.xml.bind:jaxb-api:2.3.1'
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
    runtimeOnly 'javax.activation:activation:1.1.1'

    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation 'org.mockito:mockito-core:3.+'
    testImplementation 'org.springframework.security:spring-security-test:5.3.4.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-validation:2.3.12.RELEASE'
    testImplementation 'org.testcontainers:junit-jupiter:1.17.6'
    testImplementation 'org.testcontainers:postgresql:1.17.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.7.1'
}

application {
    mainClass = 'com.example.onlinebookstore.OnlineBookstoreApplication'
}


jacoco {
    toolVersion = "0.8.10"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}
