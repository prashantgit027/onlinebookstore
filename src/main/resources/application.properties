spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
# Use Flyway for schema migrations
spring.flyway.enabled=true
spring.flyway.placeholder-replacement=true

# H2 console remains available for development

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# JWT
security.jwt.secret=ReplaceThisWithASecureSecretForProd
security.jwt.expiration-in-ms=86400000

server.port=8080
